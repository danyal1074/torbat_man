<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>تربتینو | عدم اتصال به اینترنت</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf8fc;
        color: #24202a;
        font-family: system-ui, -apple-system, Tahoma, sans-serif;
        text-align: center;
      }
      .box {
        max-width: 360px;
        background: #fff;
        border: 1px solid #e6dfec;
        border-radius: 24px;
        padding: 28px 22px;
        box-shadow: 0 8px 24px rgba(100, 21, 140, 0.08);
      }
      img {
        width: 112px;
        height: 112px;
        object-fit: contain;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 8px;
        color: #64158c;
      }
      p {
        font-size: 0.92rem;
        line-height: 1.8;
        color: #665f70;
        margin: 0 0 20px;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: #64158c;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <img src="/brand/full-logo-transparent.png" alt="تربتینو — شهر تو، همراه تو" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای استفاده از خدمات تربتینو، اینترنت دستگاه را بررسی کنید و دوباره تلاش نمایید.</p>
      <button type="button" onclick="window.location.href='https://torbat.digiral.ir/'">تلاش دوباره</button>
    </main>
  </body>
</html>
