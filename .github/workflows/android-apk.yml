name: Build Torbatino Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and build citizen-web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @torbat/citizen-web run build
          cd apps/citizen-web
          pnpm exec cap sync android

      - name: Build Debug APK
        run: |
          cd apps/citizen-web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: torbatino-debug-apk
          path: apps/citizen-web/android/app/build/outputs/apk/debug/app-debug.apk
